name: CI

# Focused PR gate. Compatibility checks live in ci-accelerators.yml and
# ci-targets.yml; PDF snapshot fidelity lives in pdf-conformance.yml.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual re-run from the Actions tab / `gh workflow run`. Left blank it runs lint
  # + test only; set `force_version` to (re)release that exact version — use it to
  # release a version a failed/blocked run skipped (e.g. the master-ruleset reject).
  workflow_dispatch:
    inputs:
      force_version:
        description: "Force a release at this exact version (e.g. 0.3.0). Blank = lint+test only, no release."
        required: false
        default: ""

# Least privilege for GITHUB_TOKEN: every job here only reads the checkout.
# The one exception — `release`, which pushes the release commit and tag —
# raises it to `contents: write` on the job itself.
permissions:
  contents: read

# Cancel superseded PR runs, but never interrupt a master run (it may release).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep target/ small enough to cache and restore: no incremental artifacts
  # (useless for one-shot CI builds, gigabytes on disk) and no debuginfo in
  # dev/test binaries (the bulk of a debug target; tests behave the same,
  # backtraces just lose line numbers). Without this the cached target/ grew
  # past 6 GB compressed (~20 GB unpacked) and cache *restore* started dying
  # with ENOSPC on the runner disk — which is also why every cache key below
  # carries a `v2` generation: the old oversized entries must never match.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Rust version for the style/lint gates. Pinned on purpose: rustfmt and clippy
  # change their output/lints between releases, so a floating `stable` would let
  # a new toolchain fail CI on otherwise-unrelated commits. Bump this manually
  # (and fix any new findings in the same PR) when you want to adopt a newer one.
  LINT_TOOLCHAIN: "1.96.0"

jobs:
  lint:
    name: fmt · clippy (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup is preinstalled on GitHub-hosted runners; use it directly rather
      # than a marketplace toolchain action (the docling-project org allowlists
      # only GitHub-owned / vetted actions).
      - name: Install Rust ${{ env.LINT_TOOLCHAIN }}
        run: |
          rustup toolchain install ${{ env.LINT_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
          rustup default ${{ env.LINT_TOOLCHAIN }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            # ort-sys's extracted prebuilt ONNX Runtime (`<cache dir>/
            # ort.pyke.io/dfbin/<target>/<hash>`): present, the build script
            # skips the cdn.pyke.io download altogether. One path per OS;
            # actions/cache ignores the ones that do not exist.
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/ort.pyke.io
          key: ${{ runner.os }}-cargo-v2-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-v2-lint-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        shell: bash
        run: scripts/ci/cargo_retry_ort.sh cargo clippy --workspace --all-targets -- -D warnings

      # actions/cache saves target/ in its post-step, i.e. after this runs:
      # drop what is cheap to recreate (incremental data shouldn't exist with
      # CARGO_INCREMENTAL=0; examples and final bin-crate executables relink
      # in seconds — the compiled library deps are what's worth keeping), so
      # the cache stays well under the runner's disk headroom.
      - name: Trim target before cache save
        if: always()
        shell: bash
        run: |
          rm -rf target/debug/examples target/debug/incremental \
                 target/release/examples target/release/incremental
          find target/debug target/release -maxdepth 1 -type f ! -name '*.d' -size +5M -exec rm -f {} + 2>/dev/null || true

  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tests stay on the current stable so they catch real compiler breakage.
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            # ort-sys's extracted prebuilt ONNX Runtime (`<cache dir>/
            # ort.pyke.io/dfbin/<target>/<hash>`): present, the build script
            # skips the cdn.pyke.io download altogether. One path per OS;
            # actions/cache ignores the ones that do not exist.
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/ort.pyke.io
          key: ${{ runner.os }}-cargo-v2-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-v2-test-

      # The one model this job fetches (17 MB): the picture classifier, so
      # docling-pdf's `picture_classifier_tells_pictures_apart` runs on an
      # x86_64 runner — #517 was an x86 NCHWc miscompile in ONNX Runtime
      # 1.26–1.28 that returned one distribution for every picture. A failed
      # download only skips that test.
      - name: Fetch the picture classifier
        run: |
          mkdir -p .models
          curl -fsSL --retry 3 -o .models/picture_classifier.onnx \
            https://github.com/docling-project/docling.rs/releases/download/models-v1/picture_classifier.onnx \
            || { rm -f .models/picture_classifier.onnx; echo "::warning::picture classifier download failed; its test skips"; }

      # Pure-Rust unit tests + the output-regression suite. The PDF/image/METS
      # snapshot tests need the layout/OCR/TableFormer models, so they are NOT
      # run here — this job stays fast. --locked doubles as the
      # guard that keeps the committed Cargo.lock in sync with the manifests
      # (a Cargo.toml change without its lock update fails here).
      - name: Test
        shell: bash
        run: scripts/ci/cargo_retry_ort.sh cargo test --workspace --locked

      # actions/cache saves target/ in its post-step, i.e. after this runs:
      # drop what is cheap to recreate (incremental data shouldn't exist with
      # CARGO_INCREMENTAL=0; examples and final bin-crate executables relink
      # in seconds — the compiled library deps are what's worth keeping), so
      # the cache stays well under the runner's disk headroom.
      - name: Trim target before cache save
        if: always()
        shell: bash
        run: |
          rm -rf target/debug/examples target/debug/incremental \
                 target/release/examples target/release/incremental
          find target/debug target/release -maxdepth 1 -type f ! -name '*.d' -size +5M -exec rm -f {} + 2>/dev/null || true

  # Validate the declared `rust-version` floors against the committed
  # Cargo.lock (rust-lang.org/2023/08/29/committing-lockfiles: a committed
  # lock is what makes MSRV checkable at all). Two tiers: docling-core keeps a
  # lower floor (no ort/pdfium), the rest of the workspace sits at the ort
  # floor. Keep these toolchains in sync with the `rust-version` values in the
  # manifests — a weekly dependency-update PR that pulls a dep with a higher
  # floor turns this job red, forcing a conscious pin or floor bump.
  msrv:
    name: msrv (1.85 core · 1.92 workspace)
    runs-on: ubuntu-latest
    env:
      MSRV_CORE: "1.85"
      MSRV_WORKSPACE: "1.92"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ env.MSRV_CORE }} + ${{ env.MSRV_WORKSPACE }}
        run: rustup toolchain install ${{ env.MSRV_CORE }} ${{ env.MSRV_WORKSPACE }} --profile minimal

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            # ort-sys's extracted prebuilt ONNX Runtime (`<cache dir>/
            # ort.pyke.io/dfbin/<target>/<hash>`): present, the build script
            # skips the cdn.pyke.io download altogether. One path per OS;
            # actions/cache ignores the ones that do not exist.
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/ort.pyke.io
          key: ${{ runner.os }}-cargo-v2-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-v2-msrv-

      - name: Check docling-core on ${{ env.MSRV_CORE }}
        run: cargo +${{ env.MSRV_CORE }} check -p docling-core --locked

      - name: Check workspace on ${{ env.MSRV_WORKSPACE }}
        shell: bash
        run: scripts/ci/cargo_retry_ort.sh cargo +${{ env.MSRV_WORKSPACE }} check --workspace --locked

      # actions/cache saves target/ in its post-step, i.e. after this runs:
      # drop what is cheap to recreate (incremental data shouldn't exist with
      # CARGO_INCREMENTAL=0; examples and final bin-crate executables relink
      # in seconds — the compiled library deps are what's worth keeping), so
      # the cache stays well under the runner's disk headroom.
      - name: Trim target before cache save
        if: always()
        shell: bash
        run: |
          rm -rf target/debug/examples target/debug/incremental \
                 target/release/examples target/release/incremental
          find target/debug target/release -maxdepth 1 -type f ! -name '*.d' -size +5M -exec rm -f {} + 2>/dev/null || true

  release:
    name: release
    needs: [lint, test]
    if: >-
      github.repository == 'docling-project/docling.rs' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.force_version != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version-bump commit + tag
      issues: write # the "Shipped in vX.Y.Z" comments on the release's issues
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, for the semantic version bump
          # Push the release commit + tag as an admin PAT so it satisfies the
          # `master` ruleset; the default GITHUB_TOKEN can't be granted a bypass.
          token: ${{ secrets.RELEASE_PAT }}

      # cargo only re-syncs Cargo.lock with the bumped versions (`cargo update
      # --workspace`): no build, no target cache — the `cargo publish` verify
      # builds and their cache moved to crates-publish.yml, which release.yml
      # dispatches for the release the maintainer picks.
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Decide the next version from conventional commits since the last tag (or
      # use force_version on a manual dispatch); if there is one, bump + commit +
      # tag it and push to master. A no-op when no release-worthy commit landed.
      # The release commit is pushed with RELEASE_PAT (an admin token, so it
      # satisfies the master ruleset) and carries [skip ci], so it does not
      # re-trigger CI. Nothing goes to crates.io from here, and no GitHub
      # Release is cut: a merge only tags. release.yml creates the Release —
      # notes from the tags (scripts/ci/release_notes.sh), not marked latest
      # until its channels succeed — for the tag the maintainer publishes, so
      # the Releases page lists what was published, not every merge.
      - name: Release
        id: release
        env:
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
        run: bash scripts/ci/release.sh

      # Tell the issues this release shipped (`Closes/Refs #NN` in the commits
      # and the merged PRs since the previous tag) that it did: one "Shipped in
      # vX.Y.Z" comment each, linking the tag's page (GitHub renders it for a
      # bare tag; the Release release.yml cuts later lands at the same URL).
      # Posted as github-actions[bot] (`issues: write` above); idempotent on a
      # forced re-release. Upstream only — a fork's CI must not comment on
      # issues whose numbers mean something else there. Never fails the job:
      # the release is already tagged, so the script only warns.
      - name: Comment on the released issues
        if: steps.release.outputs.released == 'true' && github.repository == 'docling-project/docling.rs'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/release_issue_comments.sh "v${{ steps.release.outputs.version }}"
