name: Temporary Calamine security upgrade validation
on:
  push:
    branches:
      - fix/zip-calamine-037
permissions:
  contents: read
jobs:
  lockfile-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Reconcile all Cargo lockfiles using the Cargo resolver
        run: |
          cargo metadata --format-version 1 > /dev/null
          (cd crates/docling-py && cargo metadata --format-version 1 > /dev/null)
          git diff -- Cargo.lock crates/docling-py/Cargo.lock
          test -z "$(git diff -- Cargo.lock crates/docling-py/Cargo.lock)"
      - name: Check declarative spreadsheet converter
        run: cargo check --locked -p docling --no-default-features
